<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tidpeek">
  <!--
    ไอคอนประจำแอป — ปีก

    วาดเป็นรูปทรงตันชิ้นเดียวที่มีขนซ้อนกันสามชั้น ไม่ใช้เส้นบางๆ
    เพราะไอคอนนี้ต้องอ่านออกตอนเป็น favicon ขนาด 16px ซึ่งเล็กกว่า
    ตัวอักษรหนึ่งตัว เส้นบางจะหายไปกลายเป็นจุดเบลอ

    ทรงตันที่มีรอยหยักชัดๆ ยังเห็นเป็นเงาปีกได้แม้ย่อจนเล็กมาก

    ไฟล์นี้คือต้นฉบับ ไฟล์ PNG ทั้งหมดใน public/ สร้างจากไฟล์นี้
    ด้วย scripts/gen-icons.mjs แก้ที่นี่แล้วรันสคริปต์ใหม่
  -->
  <defs>
    <linearGradient id="tidpeek-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tidpeek-bg)" />

  <path
    fill="#fff"
    d="M104 352
       C 112 254 178 174 288 136
       C 246 192 224 246 218 292
       C 268 222 326 182 400 162
       C 356 222 328 274 314 318
       C 352 284 384 268 418 262
       C 372 336 268 374 138 374
       C 112 374 102 368 104 352
       Z"
  />
</svg>
