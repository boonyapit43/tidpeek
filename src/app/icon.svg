<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tidpeek">
  <!--
    ไอคอนประจำแอป

    ออกแบบให้เหลือแค่สองชิ้น คือเส้นกราฟขาขึ้นกับจุดปลายเส้น
    เพราะไอคอนนี้ต้องอ่านออกตอนเป็น favicon ขนาด 16px ซึ่งเล็กกว่า
    ตัวอักษรหนึ่งตัว รายละเอียดอะไรที่มากกว่านี้จะกลายเป็นจุดเบลอ

    เส้นหนา 44 หน่วยบนผืน 512 (ประมาณ 8.6%) คือความหนาที่ยังเห็นเป็นเส้น
    ไม่ใช่เส้นผมตอนย่อลงมาเหลือ 16px

    ไฟล์นี้คือต้นฉบับ ไฟล์ PNG ทั้งหมดใน public/ สร้างจากไฟล์นี้
    ด้วย scripts/gen-icons.mjs แก้ที่นี่แล้วรันสคริปต์ใหม่
  -->
  <defs>
    <linearGradient id="tidpeek-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#tidpeek-bg)" />

  <path
    d="M128 335 L224 239 L288 303 L384 175"
    fill="none"
    stroke="#fff"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="384" cy="175" r="32" fill="#fff" />
</svg>
